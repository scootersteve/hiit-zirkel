<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Circle Champ">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <script>
    // A forced light/dark choice and the chosen look are applied before the first paint
    // (see js/platform/theme.js); the app corrects them from the settings right after.
    try {
      var d = document.documentElement.dataset;
      var t = localStorage.getItem('zd-theme');
      if (t === 'light' || t === 'dark') d.theme = t;
      var l = localStorage.getItem('zd-look') || 'flammen'; // default look, as in js/storage/db.js
      if (l !== 'standard' && /^[a-z]+$/.test(l)) d.look = l;
      if (localStorage.getItem('zd-anim') === 'off') d.anim = 'off';
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/looks.css">
  <title>Circle Champ</title>
</head>
<body>
  <div id="app"></div>
  <nav id="tabbar" class="tabbar" aria-label="Bereiche" hidden></nav>
  <div id="update-banner" class="update-banner" role="status" hidden>
    <span>Neue Version verfügbar</span>
    <button data-action="update">Aktualisieren</button>
  </div>
  <noscript>Circle Champ braucht JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
